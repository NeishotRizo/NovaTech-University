<div class="text-center mb-5">

<span class="section-subtitle">

ADMISIONES

</span>

<h1 class="section-title">

Solicitud de Ingreso

</h1>

<p class="section-text">

Completa el siguiente formulario para iniciar
tu proceso de admisión.

</p>

</div>

<!-- FORMULARIO -->

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0">

<div class="card-body p-5">

<form id="formRegistro">

<div class="row">

<div class="col-md-6 mb-3">

<label>

Nombre completo

</label>

<input

type="text"

id="nombre"

class="form-control"

required>

</div>

<div class="col-md-6 mb-3">

<label>

Preparatoria

</label>

<input

type="text"

id="preparatoria"

class="form-control"

required>

</div>

<div class="col-md-6 mb-3">

<label>

Fecha de nacimiento

</label>

<input

type="date"

id="fechaNacimiento"

class="form-control"

required>

</div>

<div class="col-md-6 mb-3">

<label>

Promedio

</label>

<input

type="number"

step="0.1"

id="promedio"

class="form-control"

required>

</div>

<div class="col-md-6 mb-3">

<label>

Carrera

</label>

<select

id="carrera"

class="form-select">

<option>Sistemas</option>

<option>Industrial</option>

<option>Civil</option>

</select>

</div>

<div class="col-md-6 mb-4">

<label>

Sexo

</label>

<select

id="sexo"

class="form-select">

<option>Masculino</option>

<option>Femenino</option>

</select>

</div>

</div>

<div class="text-center">

<button

class="btn btn-primary btn-lg"

type="submit">

Enviar Solicitud

</button>

</div>

</form>

</div>
