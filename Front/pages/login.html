<!-- ================= LOGIN ================= -->

<section class="hero">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="card shadow-lg border-0">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="bi bi-person-circle display-1 text-warning"></i>

                            <h2 class="mt-3">

                                Acceso Administrador

                            </h2>

                            <p class="text-muted">

                                Ingresa tus credenciales.

                            </p>

                        </div>

                        <form id="formLogin">

                            <div class="mb-3">

                                <label class="form-label">

                                    Usuario

                                </label>

                                <input

                                    type="text"

                                    id="usuario"

                                    class="form-control"

                                    required>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">

                                    Contraseña

                                </label>

                                <input

                                    type="password"

                                    id="password"

                                    class="form-control"

                                    required>

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    <i class="bi bi-box-arrow-in-right me-2"></i>

                                    Iniciar sesión

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
